<!doctype html>
<!-- The social card (public/social.png, 1200×630), in the page's colors, words and icons. render.sh renders it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html { background: #000; color: #ededed; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { box-sizing: border-box; width: 1200px; height: 630px; margin: 0; padding: 72px 80px; display: flex; flex-direction: column; }
  .mark { display: flex; align-items: center; gap: 18px; font: 500 34px/1 ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; color: #8f8f8f; letter-spacing: .02em; }
  .mark img { width: 64px; height: 64px; }
  .mark b { font-weight: inherit; }
  .mark span { color: #5c5c5c; }
  h1 { margin: auto 0; font-size: 80px; line-height: 1.08; font-weight: 600; letter-spacing: -.035em; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 14px; }
  li { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0 16px; border: 1px solid #1c1c1c; border-radius: 18px; background: #0a0a0a; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .icon { display: grid; place-items: center; width: 64px; height: 64px; border: 1px solid #222; border-radius: 15px; background: #141414; }
  .icon svg { width: 34px; height: 34px; display: block; }
</style>
</head>
