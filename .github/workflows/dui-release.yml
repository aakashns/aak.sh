# Publishes @aakashns/dui to npm whenever main has a version (in dui/package/package.json)
# that isn't on npm yet, so merging a PR that bumps the version releases it. It publishes with
# npm's trusted publishing, so there's no token: npmjs.com must trust this repo and workflow.
name: dui release

on:
  push:
    branches: [main]
    paths: [dui/package/**, .github/workflows/dui-release.yml]

permissions:
  contents: read
  id-token: write

concurrency:
  group: dui-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dui/package
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish if the version is new
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@aakashns/dui@$version" version >/dev/null 2>&1; then
            echo "@aakashns/dui@$version is already published; nothing to do"
          else
            npm publish --access public
          fi
