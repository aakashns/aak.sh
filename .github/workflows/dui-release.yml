# Builds the dui binary for Linux and macOS, and checks it serves the site and adds components
# from it. Merging a PR that bumps dui/site/package.json's version publishes the binaries as the
# dui-v<version> GitHub release, which install.sh installs once dui.aak.sh runs that version.
name: dui release

on:
  push:
    branches: [main]
    paths: [dui/site/package.json]
  pull_request:
    paths: [dui/site/**, .github/workflows/dui-release.yml]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: dui/site

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] &&
            ! git ls-remote --exit-code --tags origin "refs/tags/dui-v$version" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: github.event_name == 'pull_request' || needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: darwin-arm64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: dui/site/package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      # From another folder, so it can only serve what's embedded in it.
      - name: Smoke test
        run: |
          bin=$PWD/dist/dui
          test "$($bin version)" = "${{ needs.version.outputs.version }}"
          cd "$RUNNER_TEMP"
          PORT=44299 "$bin" start &
          server=$!
          for _ in $(seq 50); do curl -fs -o /dev/null http://127.0.0.1:44299/ && break; sleep 0.2; done
          for path in / /docs /docs/installation /docs/components /docs/components/dialog \
            /r/index.json /r/lib.json /sitemap.xml /install.sh /datastar.js /favicon.ico /social.png; do
            curl -fsS -o /dev/null "http://127.0.0.1:44299$path"
          done
          curl -fsS http://127.0.0.1:44299/r/dialog.json | jq -e '.files | length == 2 and all(.content != "")'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:44299/nope)" = 404
          curl -fsS http://127.0.0.1:44299/install.sh | grep -q 'DUI_VERSION:-${{ needs.version.outputs.version }}}'
          DUI_REGISTRY=http://127.0.0.1:44299/r "$bin" add dialog --dir project
          test -s project/ui/dialog.tsx && test -s project/ui/button.tsx && test -s project/lib/theme.css
          kill "$server"
          # And from the components built into it, with no site.
          "$bin" add dialog --dir embedded
          cmp embedded/ui/dialog.tsx project/ui/dialog.tsx && grep -q buttonCss embedded/ui/styles.ts
          "$bin" --help > /dev/null
      - run: mv dist/dui dist/dui-${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: dui-${{ matrix.target }}
          path: dui/site/dist/dui-${{ matrix.target }}
          if-no-files-found: error

  # The installation page's steps in new projects, with and without src/, through a click on
  # the quickstart's button; then the docs' forms, tabs, and contrast (see scripts/e2e.ts).
  e2e:
    needs: version
    if: github.event_name == 'pull_request' || needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: dui/site/package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # The CLI in new projects: what init and add write and keep, and upgrades from 0.2.
      - run: bun test
      - name: Quickstart
        run: |
          dui="bun $PWD/src/cli/main.ts"
          for layout in root src; do
            app="$RUNNER_TEMP/$layout"
            mkdir -p "$app"
            (
              cd "$app"
              bun init -y > /dev/null
              dir=.
              if [ "$layout" = src ]; then mkdir src; dir=src; fi
              $dui init
              $dui init | grep -q 'same     package.json'
              $dui add button
              cp "$GITHUB_WORKSPACE/dui/site/quickstart/index.tsx" "$dir/index.tsx"
              bun check
              port=$([ "$layout" = src ] && echo 3002 || echo 3001)
              PORT=$port nohup bun "$dir/index.tsx" > "$RUNNER_TEMP/$layout.log" 2>&1 &
            )
          done
      - name: Browser checks
        env:
          SCREENSHOTS: ${{ runner.temp }}/screenshots
        run: |
          PORT=3000 nohup bun src/cli/main.ts start > "$RUNNER_TEMP/site.log" 2>&1 &
          for port in 3000 3001 3002; do
            for _ in $(seq 50); do curl -fs -o /dev/null "http://127.0.0.1:$port/" && break; sleep 0.2; done
          done
          bun scripts/e2e.ts --site http://127.0.0.1:3000 \
            --quickstart http://127.0.0.1:3001 --quickstart http://127.0.0.1:3002
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dui-e2e-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  release:
    needs: [version, build, e2e]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: dui-v${{ needs.version.outputs.version }}
        run: |
          sha256sum -- dui-* > SHA256SUMS
          previous=$(git describe --tags --abbrev=0 --match 'dui-v*' "$GITHUB_SHA" 2>/dev/null || true)
          notes=(--notes "The first release of dui.")
          [ -n "$previous" ] && notes=(--generate-notes --notes-start-tag "$previous")
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" "${notes[@]}" \
            -- dui-* SHA256SUMS
